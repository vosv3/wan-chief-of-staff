<script>
window.DECK = (function () {
  'use strict';
  var slides = [
    { section: 'hire', theme: 'Welcome',
      one: 'Meet your', two: 'chief of staff.',
      copy: 'Wan, this is the plan for tonight. A new hire <br>that reads everything, never sleeps, and runs your laptop. <br>Fourteen ideas, one per slide, before we build anything.' },
    { section: 'hire', theme: 'Hire',
      one: 'A hire,', two: 'not a tool.',
      copy: 'Nobody builds a chief of staff. You hire one, then you <br>onboard it the way you’d onboard a brilliant person on <br>day one: who we are, what we do, how we like it done.' },
    { section: 'hire', theme: 'Power',
      one: 'Superhuman,', two: 'and in control.',
      copy: 'It reads faster than any human, and it can open, edit, <br>send and browse on this laptop. That much power is <br>exactly why the next eleven slides exist.' },
    { section: 'onboard', theme: 'Onboard',
      one: 'Four things', two: 'every hire needs.',
      copy: 'Knowledge of the business. Tools and access. SOPs for <br>how the work gets done. And a memory, so a lesson <br>learned once stays learned. We install all four tonight.' },
    { section: 'onboard', theme: 'Folder',
      one: 'The folder', two: 'is the office.',
      copy: 'Everything lives in one folder on your laptop that you <br>own, written in plain text you can open and read. <br>No database, no dashboard, nothing hidden from you.' },
    { section: 'onboard', theme: 'Instructions',
      one: 'The file it', two: 'reads first.',
      copy: 'One short instructions file is read at the start of every <br>session. It says who you are, how to work with you, and <br>where everything else lives. It stays lean on purpose.' },
    { section: 'onboard', theme: 'Context',
      one: 'Knowledge,', two: 'read on demand.',
      copy: 'Six short files, each read only when a task needs it: you, <br>the business, offers, customers, voice and working style. <br>Wrong context is worse than none, so every file is dated.' },
    { section: 'onboard', theme: 'Memory',
      one: 'Memory', two: 'with a gate.',
      copy: 'When you correct it, it proposes what to remember and <br>where. Nothing is saved until you approve the wording. <br>Small, true and yours, so it never contradicts itself.' },
    { section: 'onboard', theme: 'Skills',
      one: 'SOPs', two: 'become skills.',
      copy: 'Do the job together until the result is right, then <br>package it as a skill you run by name. Fewer, better <br>skills beat a library, and each one keeps its own lessons.' },
    { section: 'trust', theme: 'Trust',
      one: 'Access without', two: 'giving up control.',
      copy: 'Read-only first. Write access one tool at a time, when a <br>job needs it. Destructive actions blocked. And never a <br>password, card or bank detail typed into the agent.' },
    { section: 'trust', theme: 'Sessions',
      one: 'One job', two: 'per session.',
      copy: 'Fresh sessions beat long ones. Start one for each job, <br>then end it by logging what was done, what was touched <br>outside the folder, and what was learned.' },
    { section: 'run', theme: 'Plan',
      one: 'Numbers first,', two: 'then a plan.',
      copy: 'One source of live metrics, so questions get this <br>month’s answer. A written plan before anything big. <br>And a task audit that decides what to automate next.' },
    { section: 'run', theme: 'Routines',
      one: 'Prove it by hand,', two: 'then schedule it.',
      copy: 'A skill earns a clock only after it works from a one-line <br>prompt. A routine is one line that runs a proven skill on <br>a timer, and every run has to show that it actually ran.' },
    { section: 'run', theme: 'Tonight',
      one: 'Keep it', two: 'healthy.',
      copy: 'A monthly clean-up, nothing changed without your written <br>approval. Backup and version history connected next week. <br>Tonight: the interview, then the first real job.' }
  ];
  return { slides: slides, planSlide: 13 };
